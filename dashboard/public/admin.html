<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorChef</title>
    <link rel="preconnect" href="https://www.gstatic.com">
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/emu.js"></script>
    <script>
        // Registra o Service Worker (pré-cacheia o PDV e o próprio shell) assim
        // que o painel abre, sem depender de o operador já ter aberto o Caixa
        // antes com internet.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
        }
    </script>
    <link rel="stylesheet" href="/shell.css">
    <style>
        html, body { height: 100%; overflow: hidden; background: #f4f6f9; }
        body { margin: 0; }
        #admin-frame {
            display: block;
            width: calc(100vw - var(--sb-w));
            height: 100vh;
            border: 0;
            background: #f4f6f9;
        }
        @media (max-width: 1100px) {
            #admin-frame { width: 100vw; }
        }
    </style>
</head>

<body data-admin-shell="true">
    <iframe id="admin-frame" title="GestorChef"></iframe>
    <script src="/shell.js" defer></script>
    <script src="/admin-shell.js"></script>
</body>

</html>
