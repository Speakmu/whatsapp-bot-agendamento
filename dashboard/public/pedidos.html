<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos os pedidos | GestorChef</title>
    <link rel="preconnect" href="https://www.gstatic.com">

    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/emu.js"></script>

    <link rel="stylesheet" href="/shell.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg:#f4f6f9; --card:#fff; --txt:#2c3e50; --muted:#7f8c8d; --accent:#ff5200; --ok:#2ecc71; --danger:#e74c3c; --warn:#e67e22; --line:#e1e5ea; --blue:#2f6fed; }
        body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',Roboto,system-ui,sans-serif; min-height:100vh; }
        header.top { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; background:#fff; border-bottom:3px solid var(--accent); position:sticky; top:0; z-index:5; }
        header.top h1 { font-size:1.4rem; }
        .link { border:1px solid var(--line); background:#fff; color:var(--txt); padding:8px 14px; border-radius:8px; text-decoration:none; font-size:.9rem; }
        .wrap { padding:20px 24px; max-width:1200px; display:grid; gap:18px; }
        .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
        .box-head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
        .box h2 { font-size:1.1rem; }
        .filtros { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .filtros input, .filtros select { padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:.88rem; font-family:inherit; }
        table { width:100%; border-collapse:collapse; font-size:.9rem; }
        th, td { text-align:left; padding:10px; border-bottom:1px solid var(--line); vertical-align:top; }
        th { color:var(--muted); font-size:.78rem; text-transform:uppercase; }
        td.num { text-align:right; white-space:nowrap; }
        .sub { color:var(--muted); font-size:.82rem; margin-top:2px; }
        .badge { padding:3px 10px; border-radius:12px; font-size:.76rem; font-weight:700; white-space:nowrap; }
        .b-ok { background:#e6f9ef; color:#1e8e4f; }
        .b-pend { background:#fff8e6; color:#8a6d00; }
        .b-can { background:#fdecea; color:#c0392b; }
        .vazio { color:var(--muted); padding:14px; text-align:center; }
        @media (max-width:760px){ th:nth-child(3), td:nth-child(3) { display:none; } }
    </style>
</head>

<body>
    <header class="top">
        <h1>📋 Todos os pedidos</h1>
        <a class="link" href="/home.html">&larr; Início</a>
    </header>

    <div class="wrap">
        <div class="box">
            <div class="box-head">
                <h2>Histórico de pedidos</h2>
                <div class="filtros">
                    <input type="date" id="f-data">
                    <select id="f-status">
                        <option value="">Todos os status</option>
                    </select>
                    <select id="f-pagamento">
                        <option value="">Todas as formas de pagamento</option>
                    </select>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Cliente</th>
                        <th>Itens</th>
                        <th>Forma de pagamento</th>
                        <th>Status</th>
                        <th class="num">Valor</th>
                    </tr>
                </thead>
                <tbody id="tbody-pedidos"></tbody>
            </table>
            <div id="vazio" class="vazio" style="display:none;">Nenhum pedido encontrado.</div>
            <div style="text-align:center; margin-top:14px;">
                <button class="link" id="btn-carregar-mais" style="cursor:pointer;">Carregar mais</button>
            </div>
        </div>
    </div>

    <script src="/shell.js" defer></script>
    <script src="/pedidos.js"></script>
</body>

</html>
