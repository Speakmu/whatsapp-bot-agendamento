<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento do Bot | GestorChef</title>
    <link rel="preconnect" href="https://www.gstatic.com">

    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/emu.js"></script>

    <link rel="stylesheet" href="/shell.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg:#f4f6f9; --card:#fff; --txt:#2c3e50; --muted:#7f8c8d; --accent:#ff5200; --ok:#2ecc71; --danger:#e74c3c; --line:#e1e5ea; }
        body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',Roboto,system-ui,sans-serif; min-height:100vh; }
        header.top { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; background:#fff; border-bottom:3px solid var(--accent); position:sticky; top:0; z-index:5; }
        header.top h1 { font-size:1.4rem; }
        .link { border:1px solid var(--line); background:#fff; color:var(--txt); padding:8px 14px; border-radius:8px; text-decoration:none; font-size:.9rem; }

        .layout { display:grid; grid-template-columns:320px 1fr; gap:16px; padding:16px 20px; height:calc(100vh - 66px); }

        .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; overflow:hidden; }
        .panel-head { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .panel-head h2 { font-size:1rem; }
        .btn { padding:8px 14px; border:none; border-radius:8px; cursor:pointer; font-weight:700; font-size:.85rem; }
        .btn-refresh { background:#eef2f7; color:var(--txt); }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-primary:disabled { opacity:.5; cursor:default; }

        .conv-list { overflow-y:auto; flex:1; padding:8px; }
        .conv-item { border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; cursor:pointer; background:#fff; }
        .conv-item:hover { border-color:#c9d3e0; }
        .conv-item.active { border-color:var(--accent); background:#fff6f2; }
        .conv-item .conv-id { font-weight:800; font-size:.92rem; }
        .conv-item .conv-preview { color:var(--muted); font-size:.8rem; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .conv-item .conv-meta { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
        .conv-item .conv-time { color:var(--muted); font-size:.72rem; }
        .badge-manual { background:#fff0d9; color:#a8620a; border-radius:999px; padding:2px 8px; font-size:.7rem; font-weight:800; }
        .badge-atencao { display:inline-block; background:#fdecea; color:#c0392b; border-radius:999px; padding:2px 8px; font-size:.72rem; font-weight:800; margin:4px 0; }
        .conv-item.precisa-atencao { border-color:#f3b6ae; background:#fffaf9; }
        .empty { color:var(--muted); font-size:.88rem; padding:16px; text-align:center; }

        .chat-wrap { display:grid; grid-template-rows:auto 1fr auto; }
        .chat-head { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
        .chat-head .chat-id { font-weight:800; font-size:1rem; }
        .toggle-manual { display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--muted); }
        .toggle-manual input { width:38px; height:20px; accent-color:var(--accent); }

        .messages { overflow-y:auto; padding:16px; background:#f8f9fb; }
        .msg { max-width:72%; padding:10px 12px; border-radius:12px; margin-bottom:10px; line-height:1.35; white-space:pre-wrap; word-break:break-word; font-size:.92rem; }
        .msg.user { background:#fff; border:1px solid var(--line); margin-right:auto; }
        .msg.assistant { background:#ffe8dc; border:1px solid #ffd2b8; margin-left:auto; }
        .msg .msg-time { display:block; margin-top:6px; font-size:.7rem; opacity:.65; }

        .composer { border-top:1px solid var(--line); padding:12px; display:grid; grid-template-columns:1fr auto; gap:8px; align-items:end; }
        .composer textarea { border:1px solid var(--line); border-radius:10px; resize:vertical; min-height:52px; max-height:120px; padding:10px; font-size:.92rem; font-family:inherit; }
        .composer button { height:42px; }
        .chat-empty { display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); font-size:.92rem; }

        @media (max-width:900px) { .layout { grid-template-columns:1fr; height:auto; } .conv-list { max-height:280px; } }
    </style>
</head>

<body>
    <header class="top">
        <h1>&#128172; Atendimento do Bot</h1>
        <a class="link" href="/bot-config.html">Configura&ccedil;&otilde;es do Bot &rarr;</a>
    </header>

    <div class="layout">
        <section class="panel">
            <div class="panel-head">
                <h2>Conversas</h2>
                <button class="btn btn-refresh" id="btn-refresh-conversas">Atualizar</button>
            </div>
            <div id="conv-list" class="conv-list">
                <div class="empty">Carregando conversas...</div>
            </div>
        </section>

        <section class="panel chat-wrap">
            <div class="chat-head">
                <div>
                    <div class="chat-id" id="chat-id">Selecione uma conversa</div>
                    <div class="chat-status" id="chat-status" style="color:var(--muted);font-size:.8rem"></div>
                </div>
                <label class="toggle-manual">
                    <input type="checkbox" id="toggle-manual" disabled>
                    Assumir controle manual
                </label>
            </div>
            <div id="messages" class="messages">
                <div class="chat-empty">Escolha uma conversa na lista ao lado.</div>
            </div>
            <div class="composer">
                <textarea id="reply-text" placeholder="Digite a resposta para o cliente..." disabled></textarea>
                <button class="btn btn-primary" id="btn-send" disabled>Enviar</button>
            </div>
        </section>
    </div>

    <script src="/shell.js" defer></script>
    <script src="/bot-chat.js"></script>
</body>

</html>
