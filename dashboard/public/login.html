<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GestorChef</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/emu.js"></script>

    <link rel="stylesheet" href="/styles.css?v=2">
</head>
<body>
    <div id="login-screen" class="full-screen-center">
        <h2>🍕 GestorChef</h2>
        <p style="color:#7f8c8d;margin-bottom:10px;">Acesso restrito</p>
        <input type="email" id="email-input" placeholder="E-mail">
        <input type="password" id="password-input" placeholder="Senha">
        <button id="login-button">Entrar no Painel</button>
        <p id="error-message" style="color: #e74c3c; margin-top: 10px;"></p>
    </div>

    <script src="app-auth.js"></script> 
</body>
</html>
