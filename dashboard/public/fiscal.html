<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo Fiscal | GestorChef</title>
    <link rel="preconnect" href="https://www.gstatic.com">
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/emu.js"></script>
    <link rel="stylesheet" href="/shell.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg:#f4f6f9; --card:#fff; --txt:#17212f; --muted:#64748b; --accent:#174e2a; --line:#dde3ea; --ok:#1f8f4d; --warn:#c77700; --danger:#c0392b; }
        body { min-height:100vh; background:var(--bg); color:var(--txt); font-family:"Segoe UI",Roboto,system-ui,sans-serif; }
        header.top { position:sticky; top:0; z-index:5; background:#fff; border-bottom:3px solid var(--accent); padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
        header.top h1 { font-size:1.35rem; }
        .top-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .link,.btn { border:1px solid var(--line); background:#fff; color:var(--txt); padding:8px 12px; border-radius:8px; text-decoration:none; font-size:.88rem; font-weight:700; cursor:pointer; }
        .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
        .btn.danger { background:var(--danger); border-color:var(--danger); color:#fff; }
        .btn:disabled { opacity:.6; cursor:not-allowed; }
        .wrap { padding:20px 24px; max-width:1240px; display:grid; gap:16px; }
        .tabs { display:flex; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:10px; }
        .tab { border:1px solid var(--line); background:#fff; color:var(--muted); padding:9px 12px; border-radius:8px; cursor:pointer; font-weight:700; }
        .tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
        .grid { display:grid; gap:14px; }
        .cards { grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); }
        .card,.panel { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; box-shadow:0 6px 18px rgba(15,23,42,.04); }
        .metric-label { color:var(--muted); font-size:.78rem; text-transform:uppercase; font-weight:800; }
        .metric-value { font-size:1.75rem; font-weight:900; margin-top:4px; }
        .panel h2 { font-size:1.08rem; margin-bottom:12px; }
        .panel-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
        .muted { color:var(--muted); }
        .notice { border:1px solid #f3d48a; background:#fff8e6; color:#6f5200; padding:10px 12px; border-radius:8px; display:none; }
        table { width:100%; border-collapse:collapse; font-size:.9rem; }
        th,td { text-align:left; padding:10px; border-bottom:1px solid var(--line); vertical-align:top; }
        th { color:var(--muted); font-size:.75rem; text-transform:uppercase; }
        td.num,th.num { text-align:right; }
        .badge { display:inline-block; padding:3px 9px; border-radius:999px; font-size:.74rem; font-weight:900; }
        .b-ok { background:#e6f7ed; color:var(--ok); }
        .b-warn { background:#fff1d6; color:var(--warn); }
        .b-danger { background:#fdebea; color:var(--danger); }
        .b-muted { background:#eef1f4; color:#596575; }
        .chave { font-family:Consolas,monospace; color:var(--muted); font-size:.78rem; word-break:break-all; }
        .form-grid { display:grid; grid-template-columns:repeat(4,minmax(130px,1fr)); gap:12px; align-items:end; }
        .settings-grid { display:grid; grid-template-columns:repeat(2,minmax(220px,1fr)); gap:12px; }
        .settings-grid.full { grid-template-columns:1fr; }
        .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px; }
        .sub { color:var(--muted); font-size:.86rem; margin:-4px 0 12px; }
        .switch-row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px; background:#f8fafc; border:1px solid var(--line); border-radius:8px; margin-bottom:14px; }
        .switch-row .t { font-weight:800; }
        .switch-row .d { font-size:.82rem; color:var(--muted); }
        .toggle { position:relative; width:50px; height:28px; flex:0 0 auto; }
        .toggle input { display:none; }
        .toggle span { position:absolute; inset:0; background:#cbd5e1; border-radius:20px; cursor:pointer; transition:.2s; }
        .toggle span::after { content:''; position:absolute; width:22px; height:22px; background:#fff; border-radius:50%; top:3px; left:3px; transition:.2s; box-shadow:0 1px 4px rgba(15,23,42,.25); }
        .toggle input:checked + span { background:var(--accent); }
        .toggle input:checked + span::after { transform:translateX(22px); }
        .disabled { opacity:.55; pointer-events:none; }
        .msg { font-size:.88rem; color:var(--muted); }
        label { display:grid; gap:5px; font-size:.82rem; font-weight:800; color:#263447; }
        input,textarea,select { width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 10px; font:inherit; background:#fff; }
        textarea { min-height:76px; resize:vertical; }
        .empty { padding:18px; color:var(--muted); text-align:center; }
        .acc { border:1px solid var(--line); border-radius:8px; margin-bottom:12px; overflow:hidden; background:#fbfcfe; }
        .acc summary { list-style:none; cursor:pointer; padding:13px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:800; color:var(--accent); background:#eef4f0; user-select:none; }
        .acc summary::-webkit-details-marker { display:none; }
        .acc summary .chev { transition:transform .15s; color:var(--muted); font-weight:900; }
        .acc[open] summary .chev { transform:rotate(90deg); }
        .acc summary .tag { font-size:.72rem; font-weight:900; text-transform:uppercase; color:var(--muted); background:#e2e8f0; padding:2px 8px; border-radius:999px; }
        .acc-body { padding:16px 14px; }
        .acc-body .sub:first-child { margin-top:0; }
        @media (max-width:760px) {
            header.top { align-items:flex-start; flex-direction:column; }
            .wrap { padding:14px; }
            .form-grid { grid-template-columns:1fr; }
            .settings-grid { grid-template-columns:1fr; }
            table { font-size:.82rem; }
        }
    </style>
</head>

<body>
    <header class="top">
        <h1>Modulo Fiscal</h1>
        
    </header>
    <main class="wrap">
        <div id="fiscal-alert" class="notice"></div>
        <nav class="tabs" id="fiscal-tabs"></nav>
        <section id="fiscal-content"></section>
    </main>
    <script src="/shell.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="/fiscal-client.js"></script>
    <script src="/fiscal.js"></script>
</body>

</html>
