<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensalidade | GestorChef</title>
    <link rel="preconnect" href="https://www.gstatic.com">

    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/emu.js"></script>

    <link rel="stylesheet" href="/shell.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg:#f4f6f9; --card:#fff; --txt:#2c3e50; --muted:#7f8c8d; --accent:#ff5200; --ok:#2ecc71; --warn:#e67e22; --danger:#e74c3c; --line:#e1e5ea; }
        body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',Roboto,system-ui,sans-serif; min-height:100vh; }
        header.top { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; background:#fff; border-bottom:3px solid var(--accent); position:sticky; top:0; z-index:5; }
        header.top h1 { font-size:1.4rem; }
        .link { border:1px solid var(--line); background:#fff; color:var(--txt); padding:8px 14px; border-radius:8px; text-decoration:none; font-size:.9rem; }
        .wrap { padding:20px 24px; max-width:960px; display:grid; gap:18px; }
        .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
        .box h2 { font-size:1.1rem; margin-bottom:4px; }
        .box .sub { color:var(--muted); font-size:.85rem; margin-bottom:16px; }
        .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        .campo { margin-bottom:14px; }
        .campo label { display:block; font-size:.82rem; color:var(--muted); margin-bottom:5px; font-weight:600; }
        .campo input, .campo textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:.95rem; font-family:inherit; background:#fff; }
        .btn { padding:10px 16px; border:none; border-radius:9px; cursor:pointer; font-weight:700; color:#fff; font-size:.9rem; }
        .btn-salvar { background:var(--ok); }
        .btn-pix { background:var(--accent); }
        .acoes { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

        table { width:100%; border-collapse:collapse; }
        th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); font-size:.92rem; }
        th { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.03em; }
        .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:.76rem; font-weight:800; }
        .badge.pago { background:#e6f9ef; color:#1e8e4f; }
        .badge.pendente { background:#fff6db; color:#8a6d00; }
        .badge.atrasado { background:#fdecea; color:#c0392b; }
        .empty { color:var(--muted); padding:14px 0; }

        .pix-box { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
        .pix-box img { border:1px solid var(--line); border-radius:10px; }
        .pix-copia { flex:1; min-width:240px; }
        .pix-copia textarea { width:100%; min-height:70px; font-family:monospace; font-size:.82rem; border:1px solid var(--line); border-radius:8px; padding:10px; resize:vertical; }

        .admin-only { border-top:2px dashed var(--line); margin-top:8px; padding-top:16px; }
    </style>
</head>

<body>
    <header class="top">
        <h1>💳 Mensalidade</h1>
        <a class="link" href="/home.html">&larr; Início</a>
    </header>

    <div class="wrap">
        <div class="box" id="pix-box-wrap" style="display:none">
            <h2>Pagar mensalidade</h2>
            <div class="sub" id="cobranca-atual-desc">Carregando...</div>
            <div class="pix-box">
                <img id="pix-qr" src="" alt="QR Code PIX" width="220" height="220">
                <div class="pix-copia">
                    <label style="display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:600">PIX Copia e Cola</label>
                    <textarea id="pix-copia-cola" readonly></textarea>
                    <div class="acoes" style="margin-top:8px">
                        <button class="btn btn-pix" id="btn-copiar-pix">Copiar código PIX</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="box">
            <h2>Histórico de mensalidades</h2>
            <div class="sub">Cobranças lançadas para esta loja.</div>
            <table>
                <thead>
                    <tr><th>Referência</th><th>Valor</th><th>Vencimento</th><th>Status</th><th></th></tr>
                </thead>
                <tbody id="mensalidades-tbody">
                    <tr><td colspan="5" class="empty">Carregando...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="box admin-box" id="admin-box" style="display:none">
            <h2>Área do fornecedor</h2>
            <div class="sub">Só visível pra quem lança as cobranças.</div>

            <div class="campo">
                <label>Referência (ex: 08/2026)</label>
                <input id="nova-referencia" placeholder="MM/AAAA">
            </div>
            <div class="grid2">
                <div class="campo"><label>Valor (R$)</label><input id="nova-valor" type="number" step="0.01" min="0"></div>
                <div class="campo"><label>Vencimento</label><input id="nova-vencimento" type="date"></div>
            </div>
            <div class="acoes"><button class="btn btn-salvar" id="btn-lancar">Lançar mensalidade</button></div>

            <div class="admin-only">
                <h2 style="font-size:1rem">Dados do PIX</h2>
                <div class="grid2">
                    <div class="campo"><label>Chave PIX</label><input id="cfg-pix-chave"></div>
                    <div class="campo"><label>Nome do recebedor</label><input id="cfg-pix-recebedor"></div>
                    <div class="campo"><label>Valor padrão (R$)</label><input id="cfg-valor-padrao" type="number" step="0.01" min="0"></div>
                </div>
                <div class="acoes"><button class="btn btn-salvar" id="btn-salvar-cobranca">Salvar configuração</button></div>
            </div>
        </div>
    </div>

    <script src="/shell.js" defer></script>
    <script src="/mensalidades.js"></script>
</body>

</html>
