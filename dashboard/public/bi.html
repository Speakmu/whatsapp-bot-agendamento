<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI / Vendas | GestorChef</title>
    <link rel="preconnect" href="https://www.gstatic.com">

    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/emu.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

    <link rel="stylesheet" href="/shell.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg:#f4f6f9; --card:#fff; --txt:#2c3e50; --muted:#7f8c8d; --accent:#ff5200; --ok:#2ecc71; --danger:#e74c3c; --warn:#e67e22; --line:#e1e5ea; --blue:#2f6fed; }
        body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',Roboto,system-ui,sans-serif; min-height:100vh; }
        header.top { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:#fff; border-bottom:3px solid var(--accent); position:sticky; top:0; z-index:5; gap:10px; flex-wrap:wrap; }
        header.top h1 { font-size:1.3rem; }
        .filtros { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
        .filtros .campo { display:flex; flex-direction:column; }
        .filtros label { font-size:.72rem; color:var(--muted); margin-bottom:3px; }
        .filtros input { padding:8px; border:1px solid var(--line); border-radius:8px; }
        .btn { padding:9px 14px; border:none; border-radius:8px; cursor:pointer; font-weight:600; font-size:.9rem; color:#fff; background:var(--blue); }
        .link { border:1px solid var(--line); background:#fff; color:var(--txt); padding:8px 14px; border-radius:8px; text-decoration:none; font-size:.9rem; }

        .wrap { padding:16px; display:grid; gap:16px; max-width:1280px; margin:0 auto; }
        .kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
        .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
        .kpi .rotulo { font-size:.74rem; color:var(--muted); text-transform:uppercase; }
        .kpi .valor { font-size:1.4rem; font-weight:800; margin-top:6px; }
        .kpi .delta { font-size:.78rem; margin-top:4px; font-weight:600; }
        .delta.up { color:var(--ok); } .delta.down { color:var(--danger); }
        .kpi.cancel .valor { color:var(--danger); }

        .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
        .box h2 { font-size:1rem; margin-bottom:12px; }
        .box.full { grid-column:1 / -1; }
        canvas { max-height:300px; }
        table { width:100%; border-collapse:collapse; font-size:.9rem; }
        th, td { text-align:left; padding:9px; border-bottom:1px solid var(--line); }
        th { color:var(--muted); font-size:.76rem; text-transform:uppercase; }
        td.num, th.num { text-align:right; }
        .vazio { color:var(--muted); padding:14px; text-align:center; }
        @media (max-width:900px){ .kpis{ grid-template-columns:1fr 1fr; } .grid{ grid-template-columns:1fr; } }
    </style>
</head>

<body>
    <header class="top">
        <h1>📈 BI / Vendas</h1>
        <div class="filtros">
            <div class="campo"><label>De</label><input type="date" id="data-ini"></div>
            <div class="campo"><label>Até</label><input type="date" id="data-fim"></div>
            <button class="btn" id="btn-aplicar">Aplicar</button>
        </div>
        <a class="link" href="/home.html">← Início</a>
    </header>

    <div class="wrap">
        <div class="kpis">
            <div class="kpi"><div class="rotulo">Faturamento</div><div class="valor" id="k-fat">R$ 0,00</div><div class="delta" id="k-fat-d"></div></div>
            <div class="kpi"><div class="rotulo">Pedidos</div><div class="valor" id="k-ped">0</div><div class="delta" id="k-ped-d"></div></div>
            <div class="kpi"><div class="rotulo">Ticket médio</div><div class="valor" id="k-tkt">R$ 0,00</div></div>
            <div class="kpi"><div class="rotulo">Itens vendidos</div><div class="valor" id="k-itens">0</div></div>
            <div class="kpi cancel"><div class="rotulo">Cancelamento</div><div class="valor" id="k-canc">0%</div></div>
        </div>

        <div class="grid">
            <div class="box full"><h2>Vendas por dia (receita)</h2><canvas id="c-dia"></canvas></div>
            <div class="box"><h2>Horários de pico (pedidos por hora)</h2><canvas id="c-hora"></canvas></div>
            <div class="box"><h2>Vendas por canal</h2><canvas id="c-canal"></canvas></div>
            <div class="box"><h2>Formas de pagamento</h2><canvas id="c-pag"></canvas></div>
            <div class="box"><h2>Vendas por categoria</h2><canvas id="c-cat"></canvas></div>
            <div class="box full"><h2>Top 10 produtos</h2><canvas id="c-prod"></canvas></div>
            <div class="box"><h2>Top clientes</h2>
                <table><thead><tr><th>Cliente</th><th class="num">Pedidos</th><th class="num">Total</th></tr></thead>
                    <tbody id="t-clientes"></tbody></table>
            </div>
        </div>
    </div>

    <script src="/shell.js" defer></script>
    <script src="/bi.js"></script>
</body>

</html>
